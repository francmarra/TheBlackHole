[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theblackhole"
version = "0.1.0"
description = "A 3D space simulation with a custom renderer written in Python"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Francisco Brandão Marracho" }]
requires-python = ">=3.10"
dependencies = [
    "pygame-ce==2.5.8",
    "numpy==2.3.1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.17.3", "pillow", "mypy"]

[project.scripts]
theblackhole = "theblackhole.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
# Legacy 2D version, kept as-is for reference
extend-exclude = ["space_simulation.py"]

[tool.ruff.lint]
# Type hints and docstrings are required in the package (Day 23), not in tests and scripts
extend-select = ["ANN", "D101", "D102", "D103", "D204", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]
"scripts/*" = ["ANN", "D"]
