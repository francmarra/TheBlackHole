name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # ruff is pinned so a new release with new default rules can't break the build
      - run: pip install -r requirements.txt ruff==0.17.3
      - run: ruff check .
      - run: pytest -q
